<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinGroup | Secure Gateway</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Dark minimal theme matching singroup.store */
        body { 
            font-family: 'Vazirmatn', Tahoma, sans-serif; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a0a; 
            color: #f5f5f5;
        }
        
        /* Glassmorphism/Dark solid card design */
        .card { 
            background: #171717; 
            padding: 40px 30px; 
            border-radius: 12px; 
            border: 1px solid #262626;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            text-align: center;
            max-width: 90%;
            width: 420px;
        }
        
        /* Brand Logo placeholder */
        .brand-logo {
            max-width: 120px;
            height: auto;
            margin: 0 auto 25px auto;
            display: block;
            filter: invert(1);
        }
        
        .card h2 { 
            margin-bottom: 12px; 
            color: #ffffff; 
            font-weight: 500;
            font-size: 1.4rem;
        }
        
        .card p { 
            line-height: 1.8; 
            margin-bottom: 30px; 
            font-size: 0.95rem; 
            color: #a3a3a3; 
            font-weight: 300;
        }
        
        .card p strong {
            color: #ffffff;
            font-weight: 700;
        }
        
        /* Minimalist High-Contrast Button */
        .btn { 
            display: block; 
            width: 100%;
            padding: 14px; 
            background: #ffffff; 
            color: #000000; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .btn:hover { 
            background: #e5e5e5; 
            transform: translateY(-2px);
        }
        
        /* Minimalist Loader */
        .loader {
            border: 3px solid #262626;
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* iOS Fallback Guide (Dark mode adapted) */
        .ios-guide {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background-color: #262626;
            border: 1px solid #404040;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #d4d4d4;
        }
        .ios-guide strong { color: #ffffff; }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="SinGroup Logo" class="brand-logo" onerror="this.style.display='none'">
        
        <div class="loader"></div>
        <h2>انتقال به فروشگاه</h2>
        <p>برای مشاهده سریع محصولات، لطفاً <strong>فیلترشکن (VPN) خود را خاموش کنید</strong> و سپس روی دکمه زیر کلیک نمایید.</p>
        
        <a href="#" id="action-btn" class="btn">تایید و ورود به سایت</a>
        
        <div id="ios-guide" class="ios-guide">
            <strong>کاربر گرامی آیفون:</strong><br>
            در صورتی که منتقل نشدید، لطفاً روی سه نقطه بالای صفحه (•••) کلیک کرده و <strong>Open in System Browser</strong> را انتخاب کنید.
        </div>
    </div>

    <script>
        // Configuration
        const targetDomain = "singroup.store";
        
        // Extract the exact path, query string, and hash requested by the user
        const requestedPath = window.location.pathname + window.location.search + window.location.hash;
        const fullTargetUrl = "https://" + targetDomain + requestedPath;

        // Environment Detection
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isInstagram = (userAgent.indexOf('Instagram') > -1);
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        document.addEventListener("DOMContentLoaded", function() {
            const actionBtn = document.getElementById("action-btn");
            const iosGuide = document.getElementById("ios-guide");

            // Strip protocol for Android Intent routing
            const cleanUrlForIntent = targetDomain + requestedPath;

            if (isInstagram) {
                if (isAndroid) {
                    // Force Android Chrome App
                    actionBtn.href = "intent://" + cleanUrlForIntent + "#Intent;scheme=https;package=com.android.chrome;end";
                } else if (isIOS) {
                    // Provide fallback for iOS users
                    actionBtn.href = fullTargetUrl;
                    iosGuide.style.display = "block";
                }
            } else {
                // Standard Browser behavior
                actionBtn.href = fullTargetUrl;
                
                // Set dynamic auto-redirect timer (10 seconds fallback)
                setTimeout(function() {
                    window.location.href = fullTargetUrl;
                }, 10000);
            }
        });
    </script>
</body>
</html>
